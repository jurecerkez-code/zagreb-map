# The City's orthophoto (Ortofoto2022 public WMS). Permission by email of 29.10.2026 (opendata@zagreb.hr) answering the
# request sent the same morning: the service's imagery may be used as the texture of roofs and ground, credited
# "Grad Zagreb"; local JPEG tiles may be kept; no other conditions. scripts/sample_ortho.py sampled roof and ground
# colours for 297,013 of 298,675 buildings from it, and data/raw/ortho/ keeps the tiles that were read.
- id: gz_orthofoto
  url: https://geoportal.zagreb.hr/Public/Ortofoto2022_Public/MapServer/WMSServer
