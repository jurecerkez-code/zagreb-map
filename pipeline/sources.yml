# Zagreb's trams (pipeline/s16_zagreb_trams.py): ZET's own GTFS, 19 lines, 105 shapes and 3,838 trips on 2026-11-03,
# plus the live vehicle positions the page polls through scripts/serve.py. ZET's page
# (preuzimanja/odredbe/datoteke-u-gtfs-formatu/669) states that both the static and the realtime feed, authored by
# Zagrebački električni tramvaj d.o.o., are given under "Otvorenom dozvolom/Open Licence - The Republic of Croatia",
# whose condition is naming the source. The rails drawn under the trams are OpenStreetMap's railway=tram ways, already
# credited by the `osm` entry above: they get no second entry here.
- id: zet_gtfs
  url: https://zet.hr/gtfs-scheduled/latest
  realtime_url: https://zet.hr/gtfs-rt-protobuf
  publisher: Zagrebački električni tramvaj d.o.o. (ZET)
  product: ZET GTFS static and realtime
  dataset: ZET GTFS
  licence: LicenseRef-OD-HR
  licence_url: http://data.gov.hr/otvorena-dozvola
  attribution: ZET GTFS static and realtime, Zagrebački električni tramvaj d.o.o. (ZET), Otvorena dozvola / Open Licence (Republika Hrvatska) (modified; tram routes only, trips, shapes and stops in the map's own coordinates)
  modified: true
  corner: {en: "ZET GTFS, Otvorena dozvola", sv: "ZET GTFS, Otvorena dozvola"}
  status: confirmed

