  licence_note: {en: "email 29.10.2026", sv: "e-pošta 29.10.2026."}
  credit_as: {en: "Grad Zagreb", sv: "Grad Zagreb"}
  terms: "Grad Zagreb, used with permission (email 29.10.2026, opendata@zagreb.hr): the public Ortofoto2022 WMS imagery may be used as the texture of roofs and ground, credited 'Grad Zagreb'; local JPEG tiles are allowed; no other conditions"
  attribution: "Grad Zagreb orthophoto 2022, © Grad Zagreb, used with permission (email 29.10.2026); roof and ground colours sampled from the imagery (modified)"
  modified: true
  status: confirmed

