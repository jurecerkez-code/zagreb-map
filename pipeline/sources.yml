# Grad Zagreb's RPJKucniBroj address points (136,448 house numbers with street names). The owner confirmed
# 2026-11-10 that the layer may be used in the map if Grad Zagreb is named as the source. Downloaded once to
# data/raw/zagreb/rpj_kucni_broj.geojson and merged into the address index by pipeline/address_sources.py.
- id: gz_rpj
  url: https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/RPJKucniBroj/FeatureServer/0
  local_copy: data/raw/zagreb/rpj_kucni_broj.geojson
  downloaded: 2026-11-10
  publisher: Grad Zagreb
  product: RPJKucniBroj (house numbers and streets)
  dataset: City of Zagreb address register
  licence: LicenseRef-Permission
  licence_url: https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/RPJKucniBroj/FeatureServer/0
  licence_note: {en: "permission confirmed 2026-11-10", sv: "dozvola potvrđena 10.11.2026."}
  terms: "Grad Zagreb, used with permission (confirmed 2026-11-10): RPJKucniBroj address points may be used, credited 'Grad Zagreb'"
  attribution: RPJKucniBroj, Grad Zagreb, used with permission (2026-11-10); house numbers and streets matched to footprints (modified)
  modified: true
  corner: {en: "© Grad Zagreb", sv: "© Grad Zagreb"}
  status: confirmed

# City of Zagreb layers (Gradski ured za digitalizaciju, email from Ivana Špendić, 21.10.2026): KULTURA_ZASTITA,
# KD_pojedinacna, OBNOVA_PROCELJA and koristenje1986 may be used with the credit "Grad Zagreb" (koristenje1986 is not
# used by the build yet). The City warns its working layers can be removed at any time: the copies downloaded on
# 2026-10-20 under data/raw/year-sources are the source of truth (pipeline/zagreb_heritage.py).
- id: gz_heritage
  url: https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/KULTURA_ZASTITA/FeatureServer/0
  layers:
    - https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/KULTURA_ZASTITA/FeatureServer/0
    - https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/KD_pojedinacna/FeatureServer/0
    - https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/OBNOVA_PROCELJA/FeatureServer/0
    - https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/koristenje1986_koristenje2020_view/FeatureServer/1
  local_copy: data/raw/year-sources (kultura_zastita.geojson, kd_pojedinacna.geojson, obnova_procelja.geojson, k1986.geojson)
  downloaded: 2026-10-20
  publisher: Grad Zagreb
  product: KULTURA_ZASTITA, KD_pojedinacna, OBNOVA_PROCELJA
  dataset: City of Zagreb heritage layers (KULTURA_ZASTITA, KD_pojedinacna, OBNOVA_PROCELJA)
  licence: LicenseRef-Permission
  licence_url: https://services8.arcgis.com/Usi0jGQwMmBUpFjr/arcgis/rest/services/KULTURA_ZASTITA/FeatureServer/0
  licence_note: {en: "email 21.10.2026", sv: "e-pošta 21.10.2026."}
  terms: "Grad Zagreb, used with permission (email 21.10.2026, Gradski ured za digitalizaciju): KULTURA_ZASTITA, KD_pojedinacna, OBNOVA_PROCELJA and koristenje1986 may be used, credited 'Grad Zagreb'"
  attribution: Grad Zagreb, used with permission (email 21.10.2026); construction years parsed from the layers' dating text (modified)
  modified: true
  status: confirmed

