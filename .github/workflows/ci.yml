name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Offline on every push: lint, pipeline unit tests (the network tests skip) and web unit tests.
    # network.yml runs the network tests and the e2e job weekly and on demand.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check pipeline tests scripts

      - name: Pipeline tests (offline, ported suite)
        run: uv run pytest -q -m "not legacy"

      # The tests still written for Stockholm are not a gate, but their number is printed on every run: a fork that
      # quietly forgets them would read the same as one that ported them.
      - name: Tests not ported yet (reported, not gating)
        run: |
          uv run pytest -q -m legacy --tb=no -p no:cacheprovider > legacy-report.txt || true
          tail -2 legacy-report.txt

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Leak check
        run: |
          if [ -f scripts/public/leaks.txt ]; then
            node scripts/public/export.mjs --check
          else
            echo "no leak rules in this copy"
          fi

      # scripts/web-tests.mjs runs the same suite with the tests still written for Stockholm skipped and counted
      # (web/test/legacy_upstream.json), so this gate means what it says.
      - name: Web unit tests
        run: node scripts/web-tests.mjs

      # The unit tests never open the page, so a boot crash and a missing data file both shipped live unnoticed.
      # Two sentries for that: a static audit that every file a fetch names is tracked, and a headless boot.
      - name: Fetched files committed
        run: uv run python scripts/checks/site_fetches.py

      - name: Install node dependencies
        run: npm ci

      - name: Chromium for the boot smoke
        run: npx playwright install --with-deps chromium

      - name: Boot smoke (page boots, data answers, header counts the city)
        run: |
          python3 -m http.server 8643 --directory web &
          sleep 2
          node scripts/boot_smoke.mjs

      # Live trams die softly: the map falls back to the timetable and nothing says so. Read the published
      # snapshot the page reads, and fail if it is stale, empty or tram-less.
      - name: Live trams snapshot probe
        run: node scripts/trams_probe.mjs
