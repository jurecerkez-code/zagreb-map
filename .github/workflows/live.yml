name: Live
# The map invites you to watch real trams move, and ZET's feed sends no CORS header, so a browser cannot read it.
# The dev server parses it at /rt; a static host has nothing to parse with. This job writes the same JSON to a
# one-file `live` branch, and raw.githubusercontent serves that branch with CORS. GitHub throttles frequent
# schedules down to a handful of runs a day, so each run holds the runner and republishes every 90 seconds for
# almost four hours instead of pretending a five-minute cron is reliable.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: The timetable the feed is filtered against
        working-directory: src
        run: |
          # Scheduled production refreshes follow the deployed site. Dispatching a branch uses that exact commit's data.
          if [ "$GITHUB_REF_NAME" = main ]; then base=https://jurecerkez-code.github.io/zagreb-map/data; else base="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/web/data"; fi
          curl -fsS "$base/current.json" -o web/data/current.json 2>/dev/null || { mkdir -p web/data; curl -fsS "$base/current.json" -o web/data/current.json; }
          v=$(python3 -c "import json;d=json.load(open('web/data/current.json'));print(d.get('trams_version') or d['version'])")
          mkdir -p "web/data/$v"
          curl -fsS "$base/$v/trams.json" -o "web/data/$v/trams.json"
          echo "schedule $v, $(wc -c < "web/data/$v/trams.json") bytes"
      - name: Publish a fresh snapshot until the next run starts
        working-directory: src
        run: |
          publish="$RUNNER_TEMP/publish"
          mkdir -p "$publish"
          git -C "$publish" init -q
          git -C "$publish" config user.name live
          git -C "$publish" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$publish" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          failures=0
          end=$(( $(date +%s) + 13200 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            if python3 scripts/rt_snapshot.py rt.json; then
              failures=0
              cp rt.json "$publish/rt.json"
              git -C "$publish" add rt.json
              if git -C "$publish" rev-parse --verify HEAD >/dev/null 2>&1; then
                git -C "$publish" commit -q --amend -m "live $(date -u +%FT%TZ)"
              else
                git -C "$publish" commit -qm "live $(date -u +%FT%TZ)"
              fi
              git -C "$publish" push -qf origin HEAD:live || echo "publish failed, next snapshot will retry"
            else
              failures=$((failures + 1))
              echo "snapshot failed ($failures in a row)"
              [ "$failures" -ge 8 ] && exit 1
            fi
            sleep 90
          done
