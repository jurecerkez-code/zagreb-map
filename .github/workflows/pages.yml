name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prune data versions the site does not serve
        run: |
          current=$(python3 -c "import json;print(json.load(open('web/data/current.json'))['version'])")
          trams=$(python3 -c "import json;d=json.load(open('web/data/current.json'));print(d.get('trams_version') or d['version'])")
          echo "serving $current, with tram timetable $trams"
          for d in web/data/v*; do
            [ -d "$d" ] || continue
            if [ "$(basename "$d")" != "$current" ] && [ "$(basename "$d")" != "$trams" ]; then
              rm -rf "$d"
            fi
          done
          du -sh web
      # Which commit the site is: the page shows it in the console and via __dbg.__build, so a stale tab stops
      # impersonating the latest deploy and "is it live?" stops needing a human answer.
      - name: Bundle deployed app and module workers (source stays build-free)
        run: |
          npx --yes esbuild@0.27.0 web/app.js --bundle --format=esm --minify --outdir=web/dist --external:./vendor/*
          npx --yes esbuild@0.27.0 web/worker.js web/terrain-worker.js web/roads-worker.js --bundle --format=esm --minify --outdir=web/dist --external:./vendor/*
          node scripts/pages-dist.mjs

      - name: Stamp the build
        run: printf '{"sha":"%s","date":"%s"}\n' "${GITHUB_SHA}" "$(date -u +%FT%TZ)" > web/build.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
